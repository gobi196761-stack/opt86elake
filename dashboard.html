<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPT-86 eläkekisat – Dashboard</title>
  <!-- Asennettava web-appi (manifest, kuvakkeet, iPhonen Koti-valikko) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#2c3e50">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OPT-86 eläke">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    #groups-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .group-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.1);
      margin: 20px 0;
      padding: 20px;
    }

    h2.group-title {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
      margin: 0 0 20px 0;
      font-size: 1.8em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    th {
      background: #3498db;
      color: white;
      padding: 12px;
      text-align: left;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #ecf0f1;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    select {
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #bdc3c7;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #2980b9;
    }
    .hidden {
      display: none !important;
    }

    /* ===== Mobile optimization ===== */
    html {
      -webkit-text-size-adjust: 100%;
    }

    /* Scrollable wrapper for group tables (added in script.js) */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 20px 0;
    }
    .table-scroll table {
      margin: 0;
    }

    /* Keep the player name column visible while scrolling sideways */
    .table-scroll th:first-child,
    .table-scroll td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      background: #fff;
    }
    .table-scroll th:first-child {
      background: #3498db;
      z-index: 2;
    }

    /* Comfortable touch targets + prevents iOS auto-zoom on focus */
    select, input, button {
      font-size: 16px;
    }
    select {
      min-height: 44px;
      min-width: 64px;
      padding: 6px 8px;
    }
    button {
      min-height: 44px;
    }

    /* Top buttons must not overlap the group titles */
    h2.group-title {
      clear: right;
    }
    #groups-container button {
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 1.6em;
        margin-bottom: 12px;
      }
      h2.group-title {
        font-size: 1.4em;
        margin-bottom: 12px;
      }
      td, th {
        padding: 8px;
        font-size: 14px;
      }
      .table-scroll {
        margin: 12px 0;
      }
      .group-container {
        padding: 12px;
        border-radius: 8px;
      }
      /* Edit-mode overlay */
      #edit-groups-mode {
        padding: 8px !important;
      }
      #edit-groups-mode > div {
        padding: 16px !important;
        border-radius: 10px;
      }
      #edit-groups-mode h2 {
        font-size: 1.4em;
      }
      #edit-groups-mode p {
        font-size: 0.95em;
      }
      .edit-toolbar {
        flex-wrap: wrap;
        gap: 10px;
      }
      .edit-toolbar input {
        flex: 1 1 100% !important;
      }
      .edit-toolbar button {
        flex: 1;
      }
      .edit-footer {
        flex-direction: column-reverse;
        gap: 10px;
      }
      .edit-footer button {
        width: 100%;
      }
      #edit-lists-container > div {
        min-width: 0 !important;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1 id="monthlyResultsTitle"></h1> <!-- Otsikko kuluvan kuukauden tuloksille -->
  <div id="groups-container"></div>

  <!-- Ryhmien muokkaustila (piilotettu oletuksena) -->
  <div id="edit-groups-mode" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box;">
    <div style="background: white; max-width: 1000px; margin: 0 auto; padding: 30px; border-radius: 15px;">
      <h2 style="margin-top: 0;">Edit groups and limits</h2>
      <p>Drag players between groups with the mouse. When you are done, press "Confirm and save".</p>
      
      <div class="edit-toolbar" style="margin-bottom: 20px; padding: 15px; background: #f1f2f6; border-radius: 8px; display: flex; gap: 15px; align-items: center;">
        <input type="text" id="new-player-name" placeholder="New player name" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; flex: 1;">
        <button onclick="addPlayerToEditMode()" style="background: #2ecc71; padding: 8px 15px;">Add player</button>
        <button onclick="addNewGroupToEditMode()" style="background: #3498db; padding: 8px 15px;">Add new group</button>
      </div>
      <div id="edit-lists-container" style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 30px;">
        <!-- Ryhmälistat generoidaan täne -->
      </div>

      <div class="edit-footer" style="display: flex; gap: 15px; justify-content: flex-end;">
        <button onclick="cancelGroupEdit()" style="background: #95a5a6;">Cancel</button>
        <button onclick="saveFinalGroups()" style="background: #27ae60;">Confirm and save new groups</button>
      </div>
    </div>
  </div>

  <!-- Lataa SortableJS raahaamista varten -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <!-- Lataa Firebase-skriptit ja sovelluksen koodi -->
  <script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
