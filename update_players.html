        function generateMatches(count) {
            const matches = {};
            for (let i = 0; i < count; i++) {
                for (let j = 0; j < count; j++) {
                    if (i !== j) matches[`${i}-${j}`] = "TBD";
                }
            }
            return matches;
        }

        async function runUpdate() {
            const status = document.getElementById('status');
            try {
                status.innerText = "Signing in...";
                await signInWithEmailAndPassword(auth, "opt86kkpelaaja@dummy.mail", "1223334!");
                
                status.innerText = "Updating the database...";
                await set(ref(db, "Players"), playersData);
                
                status.innerText = "Update completed! You can close this page.";
                status.style.color = "green";
            } catch (error) {
                status.innerText = "Error: " + error.message;
                status.style.color = "red";
                console.error(error);
            }
        }

        window.runUpdate = runUpdate;
